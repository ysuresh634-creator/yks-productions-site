<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6b77"/>
      <stop offset="0.45" stop-color="#3e333c"/>
      <stop offset="1" stop-color="#120f17"/>
    </linearGradient>
    <radialGradient id="key" cx="0.32" cy="0.2" r="0.72">
      <stop offset="0" stop-color="#ffe9cf" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe9cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#base)"/>
  <rect width="800" height="1000" fill="url(#key)"/>
  <rect width="800" height="1000" fill="url(#vig)"/>
  <rect width="800" height="1000" filter="url(#grain)" opacity="0.09"/>
</svg>
